AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 8 - Tasks 8.2 + 8.4:
    - S3 artifact bucket for CodePipeline
    - Pipeline update-customer-microservice (CodeCommit + ECR → CodeDeployToECS blue/green)
    - Pipeline update-employee-microservice (CodeCommit + ECR → CodeDeployToECS blue/green)

Resources:

  # ============================================================
  # S3 Artifact Bucket (required by CodePipeline)
  # ============================================================

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "codepipeline-artifacts-${AWS::AccountId}-${AWS::Region}"

  # ============================================================
  # Task 8.2 - Pipeline: update-customer-microservice
  # Source 1: CodeCommit repo 'deployment', branch 'dev'
  # Source 2: ECR repo 'customer', tag 'latest'
  # Deploy:   CodeDeployToECS blue/green, IMAGE1_NAME placeholder
  # ============================================================

  CustomerPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: update-customer-microservice
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/PipelineRole"
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: deployment
                BranchName: dev
                PollForSourceChanges: 'true'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
            - Name: Image
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: customer
                ImageTag: latest
              OutputArtifacts:
                - Name: image-customer
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !ImportValue CodeDeploy-AppName
                DeploymentGroupName: !ImportValue CodeDeploy-CustomerDG
                TaskDefinitionTemplateArtifact: SourceArtifact
                TaskDefinitionTemplatePath: taskdef-customer.json
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: appspec-customer.yaml
                Image1ArtifactName: image-customer
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: image-customer
              RunOrder: 1

  # ============================================================
  # Task 8.4 - Pipeline: update-employee-microservice
  # Source 1: CodeCommit repo 'deployment', branch 'dev'
  # Source 2: ECR repo 'employee', tag 'latest'
  # Deploy:   CodeDeployToECS blue/green, IMAGE1_NAME placeholder
  # ============================================================

  EmployeePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: update-employee-microservice
      RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/PipelineRole"
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:

        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: deployment
                BranchName: dev
                PollForSourceChanges: 'true'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
            - Name: Image
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: employee
                ImageTag: latest
              OutputArtifacts:
                - Name: image-employee
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !ImportValue CodeDeploy-AppName
                DeploymentGroupName: !ImportValue CodeDeploy-EmployeeDG
                TaskDefinitionTemplateArtifact: SourceArtifact
                TaskDefinitionTemplatePath: taskdef-employee.json
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: appspec-employee.yaml
                Image1ArtifactName: image-employee
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: image-employee
              RunOrder: 1

Outputs:

  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: Pipeline-ArtifactBucket

  CustomerPipelineName:
    Value: !Ref CustomerPipeline
    Export:
      Name: Pipeline-CustomerName

  EmployeePipelineName:
    Value: !Ref EmployeePipeline
    Export:
      Name: Pipeline-EmployeeName
