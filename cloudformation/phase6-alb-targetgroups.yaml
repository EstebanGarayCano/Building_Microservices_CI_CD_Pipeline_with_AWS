AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 6 - Security group, Application Load Balancer, 4 target groups,
  and listener rules to route traffic to customer and employee microservices.
  Routing: / -> customer | /admin/* -> employee
  Blue/green: each microservice has a blue and a green target group.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of LabVPC

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of PublicSubnet1

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of PublicSubnet2

Resources:

  # -------------------------------------------------------
  # Security Group for the ALB
  # -------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: microservices-alb-sg
      GroupDescription: Allow HTTP traffic to the Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: microservices-alb-sg

  # -------------------------------------------------------
  # Application Load Balancer
  # -------------------------------------------------------
  MicroservicesALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: microservices-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref ALBSecurityGroup

  # -------------------------------------------------------
  # Target Groups
  # Blue/green per microservice = 4 total
  # Ports used during registration: ECS injects dynamic host ports,
  # so we use port 80 on the TG and let ECS override at registration time.
  # -------------------------------------------------------

  # Customer - Blue (active)
  CustomerTGBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: customer-tg-blue
      Protocol: HTTP
      Port: 80
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'

  # Customer - Green (standby for blue/green swap)
  CustomerTGGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: customer-tg-green
      Protocol: HTTP
      Port: 80
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'

  # Employee - Blue (active)
  EmployeeTGBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: employee-tg-blue
      Protocol: HTTP
      Port: 80
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPath: /admin/suppliers
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'

  # Employee - Green (standby for blue/green swap)
  EmployeeTGGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: employee-tg-green
      Protocol: HTTP
      Port: 80
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTP
      HealthCheckPath: /admin/suppliers
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'

  # -------------------------------------------------------
  # Listeners and routing rules
  # Listener on port 80:
  #   Rule 1 (priority 1): path /admin/* -> employee-tg-blue
  #   Default action:      path /        -> customer-tg-blue
  # Listener on port 8080 (test/green listener for CodeDeploy):
  #   Default action -> customer-tg-green
  # -------------------------------------------------------

  ListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MicroservicesALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CustomerTGBlue

  ListenerRuleEmployee:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerHTTP
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/admin/*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref EmployeeTGBlue

  # Test listener on 8080 used by CodeDeploy during blue/green shift
  ListenerTest:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MicroservicesALB
      Protocol: HTTP
      Port: 8080
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CustomerTGGreen

Outputs:
  ALBArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref MicroservicesALB
    Export:
      Name: MicroservicesALBArn

  ALBDnsName:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt MicroservicesALB.DNSName
    Export:
      Name: MicroservicesALBDnsName

  ALBSecurityGroupId:
    Description: Security group ID of the ALB
    Value: !Ref ALBSecurityGroup
    Export:
      Name: ALBSecurityGroupId

  CustomerTGBlueArn:
    Description: ARN of the customer blue target group
    Value: !Ref CustomerTGBlue
    Export:
      Name: CustomerTGBlueArn

  CustomerTGGreenArn:
    Description: ARN of the customer green target group
    Value: !Ref CustomerTGGreen
    Export:
      Name: CustomerTGGreenArn

  EmployeeTGBlueArn:
    Description: ARN of the employee blue target group
    Value: !Ref EmployeeTGBlue
    Export:
      Name: EmployeeTGBlueArn

  EmployeeTGGreenArn:
    Description: ARN of the employee green target group
    Value: !Ref EmployeeTGGreen
    Export:
      Name: EmployeeTGGreenArn

  ListenerHTTPArn:
    Description: ARN of the HTTP listener (port 80)
    Value: !Ref ListenerHTTP
    Export:
      Name: ListenerHTTPArn

  ListenerTestArn:
    Description: ARN of the test listener (port 8080)
    Value: !Ref ListenerTest
    Export:
      Name: ListenerTestArn
