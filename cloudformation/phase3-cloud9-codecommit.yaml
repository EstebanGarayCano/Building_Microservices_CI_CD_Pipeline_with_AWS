AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 3 - Cloud9 IDE (MicroservicesIDE) + CodeCommit repository (microservices).
  Pre-requisites: LabVPC and PublicSubnet1 must already exist (provided by AWS Academy lab).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of LabVPC (provided by AWS Academy)

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of PublicSubnet1 inside LabVPC

  Cloud9InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.small
      - t3.medium
    Description: EC2 instance type for Cloud9

  OwnerArn:
    Type: String
    Description: >
      ARN of the IAM user/role that will own the Cloud9 environment.
      In AWS Academy this is typically the LabRole or the federated user ARN.
      Example: arn:aws:iam::123456789012:assumed-role/vocstartsoft/user12345

Resources:

  # -------------------------------------------------------
  # CodeCommit repository: microservices source code
  # -------------------------------------------------------
  MicroservicesRepo:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: microservices
      RepositoryDescription: >
        Source code for the customer and employee microservices.

  # -------------------------------------------------------
  # Cloud9 IDE
  # -------------------------------------------------------
  MicroservicesIDE:
    Type: AWS::Cloud9::EnvironmentEC2
    Properties:
      Name: MicroservicesIDE
      Description: Development environment for the microservices project
      InstanceType: !Ref Cloud9InstanceType
      ImageId: amazonlinux-2-x86_64
      ConnectionType: CONNECT_SSH
      SubnetId: !Ref PublicSubnet1Id
      OwnerArn: !Ref OwnerArn
      AutomaticStopTimeMinutes: 30

Outputs:
  MicroservicesRepoCloneUrl:
    Description: HTTPS clone URL for the microservices CodeCommit repository
    Value: !GetAtt MicroservicesRepo.CloneUrlHttp
    Export:
      Name: MicroservicesRepoCloneUrl

  MicroservicesRepoArn:
    Description: ARN of the microservices CodeCommit repository
    Value: !GetAtt MicroservicesRepo.Arn
    Export:
      Name: MicroservicesRepoArn

  Cloud9EnvironmentId:
    Description: Cloud9 environment ID
    Value: !Ref MicroservicesIDE
    Export:
      Name: MicroservicesIDEEnvironmentId
