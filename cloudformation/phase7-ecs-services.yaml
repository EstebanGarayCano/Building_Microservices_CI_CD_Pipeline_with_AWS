AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 7 - Two ECS Fargate services (customer and employee microservices).
  Depends on: phase5 (cluster, ECR) and phase6 (ALB, target groups, security group).
  IMPORTANT: ECS task definitions must be registered BEFORE deploying this stack
  (done via CLI in Phase 5 task 5.4). Update TaskDefinitionArn parameters with
  the ARNs obtained after registration.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of LabVPC

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of PublicSubnet1

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: ID of PublicSubnet2

  CustomerTaskDefinitionArn:
    Type: String
    Description: >
      ARN of the registered ECS task definition for the customer microservice.
      Example: arn:aws:ecs:us-east-1:123456789012:task-definition/customer:1

  EmployeeTaskDefinitionArn:
    Type: String
    Description: >
      ARN of the registered ECS task definition for the employee microservice.
      Example: arn:aws:ecs:us-east-1:123456789012:task-definition/employee:1

  ECSTaskExecutionRoleArn:
    Type: String
    Description: >
      ARN of the IAM role that ECS uses to pull images from ECR and push logs to CloudWatch.
      In AWS Academy this is typically the LabRole ARN.
      Example: arn:aws:iam::123456789012:role/LabRole

Resources:

  # -------------------------------------------------------
  # Security Group for ECS tasks (allow traffic from ALB)
  # -------------------------------------------------------
  ECSTasksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: microservices-ecs-tasks-sg
      GroupDescription: Allow traffic from the ALB to ECS Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !ImportValue ALBSecurityGroupId
      Tags:
        - Key: Name
          Value: microservices-ecs-tasks-sg

  # -------------------------------------------------------
  # ECS Service: customer microservice
  # -------------------------------------------------------
  CustomerECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: customer
      Cluster: !ImportValue ECSClusterName
      LaunchType: FARGATE
      TaskDefinition: !Ref CustomerTaskDefinitionArn
      DesiredCount: 1
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1Id
            - !Ref PublicSubnet2Id
          SecurityGroups:
            - !Ref ECSTasksSecurityGroup
      LoadBalancers:
        - ContainerName: customer
          ContainerPort: 8080
          TargetGroupArn: !ImportValue CustomerTGBlueArn
      HealthCheckGracePeriodSeconds: 60

  # -------------------------------------------------------
  # ECS Service: employee microservice
  # -------------------------------------------------------
  EmployeeECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: employee
      Cluster: !ImportValue ECSClusterName
      LaunchType: FARGATE
      TaskDefinition: !Ref EmployeeTaskDefinitionArn
      DesiredCount: 1
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1Id
            - !Ref PublicSubnet2Id
          SecurityGroups:
            - !Ref ECSTasksSecurityGroup
      LoadBalancers:
        - ContainerName: employee
          ContainerPort: 8080
          TargetGroupArn: !ImportValue EmployeeTGBlueArn
      HealthCheckGracePeriodSeconds: 60

Outputs:
  CustomerServiceName:
    Description: Name of the customer ECS service
    Value: !GetAtt CustomerECSService.Name
    Export:
      Name: CustomerECSServiceName

  EmployeeServiceName:
    Description: Name of the employee ECS service
    Value: !GetAtt EmployeeECSService.Name
    Export:
      Name: EmployeeECSServiceName

  ECSTasksSecurityGroupId:
    Description: Security group ID for ECS tasks
    Value: !Ref ECSTasksSecurityGroup
    Export:
      Name: ECSTasksSecurityGroupId
