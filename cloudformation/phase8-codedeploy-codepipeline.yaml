AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Phase 8 - CodeDeploy application + deployment groups (blue/green),
  and two CodePipeline pipelines (customer + employee).
  Depends on: phase5 (ECR, ECS cluster, CodeCommit repos) and phase6 (ALB listeners + target groups).

Parameters:
  CodeDeployRoleArn:
    Type: String
    Description: >
      ARN of the IAM role for CodeDeploy (needs ECS, ALB, S3, and EC2 permissions).
      In AWS Academy use the LabRole ARN.

  CodePipelineRoleArn:
    Type: String
    Description: >
      ARN of the IAM role for CodePipeline.
      In AWS Academy use the LabRole ARN.

  ECSTaskExecutionRoleArn:
    Type: String
    Description: >
      ARN of the IAM task execution role used by ECS.
      In AWS Academy use the LabRole ARN.

  ArtifactBucketName:
    Type: String
    Description: >
      Name of an existing S3 bucket to store pipeline artifacts.
      Create it manually before deploying this stack (must be in us-east-1).

Resources:

  # -------------------------------------------------------
  # CodeDeploy Application
  # -------------------------------------------------------
  MicroservicesCodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: microservices
      ComputePlatform: ECS

  # -------------------------------------------------------
  # CodeDeploy Deployment Groups
  # -------------------------------------------------------
  CustomerDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref MicroservicesCodeDeployApp
      DeploymentGroupName: customer-dg
      ServiceRoleArn: !Ref CodeDeployRoleArn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !ImportValue ECSClusterName
          ServiceName: !ImportValue CustomerECSServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !ImportValue ListenerHTTPArn
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue ListenerTestArn
            TargetGroups:
              - Name: customer-tg-blue
              - Name: customer-tg-green

  EmployeeDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref MicroservicesCodeDeployApp
      DeploymentGroupName: employee-dg
      ServiceRoleArn: !Ref CodeDeployRoleArn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      ECSServices:
        - ClusterName: !ImportValue ECSClusterName
          ServiceName: !ImportValue EmployeeECSServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !ImportValue ListenerHTTPArn
            TestTrafficRoute:
              ListenerArns:
                - !ImportValue ListenerTestArn
            TargetGroups:
              - Name: employee-tg-blue
              - Name: employee-tg-green

  # -------------------------------------------------------
  # CodePipeline: customer microservice
  # Source: CodeCommit (microservices repo, dev branch)
  # Deploy: CodeDeploy blue/green to ECS
  # -------------------------------------------------------
  CustomerPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: customer-pipeline
      RoleArn: !Ref CodePipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: CustomerSourceCode
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: microservices
                BranchName: dev
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
            - Name: DeploymentFiles
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: deployment
                BranchName: main
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: DeploymentArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: CustomerBlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref MicroservicesCodeDeployApp
                DeploymentGroupName: customer-dg
                TaskDefinitionTemplateArtifact: DeploymentArtifact
                TaskDefinitionTemplatePath: customer-task-definition.json
                AppSpecTemplateArtifact: DeploymentArtifact
                AppSpecTemplatePath: customer-appspec.yaml
                Image1ArtifactName: DeploymentArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: DeploymentArtifact
              RunOrder: 1

  # -------------------------------------------------------
  # CodePipeline: employee microservice
  # -------------------------------------------------------
  EmployeePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: employee-pipeline
      RoleArn: !Ref CodePipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: EmployeeSourceCode
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: microservices
                BranchName: dev
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1
            - Name: DeploymentFiles
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: deployment
                BranchName: main
                PollForSourceChanges: 'false'
              OutputArtifacts:
                - Name: DeploymentArtifact
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: EmployeeBlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref MicroservicesCodeDeployApp
                DeploymentGroupName: employee-dg
                TaskDefinitionTemplateArtifact: DeploymentArtifact
                TaskDefinitionTemplatePath: employee-task-definition.json
                AppSpecTemplateArtifact: DeploymentArtifact
                AppSpecTemplatePath: employee-appspec.yaml
                Image1ArtifactName: DeploymentArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: DeploymentArtifact
              RunOrder: 1

Outputs:
  CodeDeployAppName:
    Description: Name of the CodeDeploy application
    Value: !Ref MicroservicesCodeDeployApp
    Export:
      Name: CodeDeployAppName

  CustomerPipelineName:
    Description: Name of the customer CodePipeline
    Value: !Ref CustomerPipeline
    Export:
      Name: CustomerPipelineName

  EmployeePipelineName:
    Description: Name of the employee CodePipeline
    Value: !Ref EmployeePipeline
    Export:
      Name: EmployeePipelineName
